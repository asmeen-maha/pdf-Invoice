<!DOCTYPE html>
<html lang="th">
<head>
  <!--
    Replaced by the `--base-href` argument of `flutter build web`.
    Must start and end with "/".
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="พิมพ์ใบเสร็จรับเงินซ้ำ">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ใบเสร็จรับเงิน">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">

  <title>ใบเสร็จรับเงิน</title>

  <style>
    html, body { margin: 0; height: 100%; background: #F7EEF2; }
    /* Shown until Flutter draws its first frame. */
    #app-loading {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; gap: 8px;
      font: 15px system-ui, sans-serif; color: #6E5562;
    }
    #app-loading span {
      width: 10px; height: 10px; border-radius: 50%; background: #C8236A;
      animation: app-loading-bounce 1s infinite ease-in-out;
    }
    #app-loading span:nth-child(2) { animation-delay: .15s; }
    #app-loading span:nth-child(3) { animation-delay: .3s; }
    @keyframes app-loading-bounce { 0%, 80%, 100% { opacity: .25; transform: scale(.8); } 40% { opacity: 1; transform: scale(1); } }
  </style>
</head>
<body>
  <div id="app-loading" aria-label="กำลังโหลด"><span></span><span></span><span></span></div>

  <script>
    // Remove the loading dots once Flutter has rendered.
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('app-loading');
      if (el) el.remove();
    });

    // Older builds registered a service worker that serves cached (stale) files.
    // Unregister it so users always get the latest deploy.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        regs.forEach(function (r) { r.unregister(); });
      });
    }
  </script>

  <!-- PDF.js for the PDF preview, served locally (otherwise the printing package loads it from unpkg.com). -->
  <script src="assets/pdfjs/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = "assets/pdfjs/pdf.worker.min.js";
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
